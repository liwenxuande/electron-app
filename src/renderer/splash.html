<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { background: #E07800; border-radius: 10px; overflow: hidden; }
  body {
    width: 100vw; height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: linear-gradient(135deg, #FF8C00, #E07800);
    font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
    -webkit-app-region: drag;
    user-select: none;
    border-radius: 15px;
    overflow: hidden;
  }
  .logo {
    width: 64px; height: 64px;
    background: rgba(255,255,255,0.15);
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 18px;
    animation: pulse 2s ease-in-out infinite;
  }
  .logo svg { width: 36px; height: 36px; }
  .name {
    font-size: 22px; font-weight: 600;
    color: #fff; letter-spacing: 2px;
    margin-bottom: 24px;
  }
  .loader {
    display: flex; gap: 6px;
  }
  .loader span {
    width: 8px; height: 8px;
    background: rgba(255,255,255,0.6);
    border-radius: 50%;
    animation: bounce 1.4s ease-in-out infinite both;
  }
  .loader span:nth-child(1) { animation-delay: -0.32s; }
  .loader span:nth-child(2) { animation-delay: -0.16s; }
  .loader span:nth-child(3) { animation-delay: 0; }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
    40% { transform: scale(1); opacity: 1; }
  }
</style>
</head>
<body>
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
      <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
    </svg>
  </div>
  <div class="name">个人记账</div>
  <div class="loader">
    <span></span><span></span><span></span>
  </div>
</body>
</html>
