appId: com.electron.crud-app
productName: 人员管理系统
executableName: lwx-crud
directories:
  buildResources: build
  output: release
files:
  - out/**/*
extraResources:
  - from: build/icon.ico
    to: icon.ico
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: build/icon.icns
