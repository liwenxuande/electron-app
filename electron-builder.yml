appId: com.electron.personal-finance
productName: 个人记账
executableName: personal-finance
directories:
  buildResources: build
  output: release
files:
  - out/**/*
extraResources:
  - from: build/icon.ico
    to: icon.ico
  - from: src/renderer/splash.html
    to: splash.html
  - from: resources/mcp-agent.cjs
    to: resources/mcp-agent.cjs
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  electronLanguages:
    - zh-CN
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: build/icon.icns
