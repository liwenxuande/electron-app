appId: com.electron.crud-app
productName: 人员管理系统
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - "!node_modules"
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: build/icon.icns
