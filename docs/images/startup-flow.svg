<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 580" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <linearGradient id="startGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C4DFF;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#7C4DFF;stop-opacity:0.25"/>
    </linearGradient>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#26A69A;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#26A69A;stop-opacity:0.2"/>
    </linearGradient>
    <linearGradient id="endGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF7043;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#FF7043;stop-opacity:0.25"/>
    </linearGradient>
    <filter id="sh">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- 起始节点 -->
  <rect x="225" y="20" width="250" height="45" rx="22" fill="url(#startGrad)" stroke="#7C4DFF" stroke-width="2" filter="url(#sh)"/>
  <text x="350" y="48" text-anchor="middle" font-size="15" font-weight="bold" fill="#4527A0">app.whenReady()</text>

  <!-- 箭头 -->
  <line x1="350" y1="65" x2="350" y2="85" stroke="#BDBDBD" stroke-width="1.5"/>
  <polygon points="344,83 356,83 350,93" fill="#BDBDBD"/>

  <!-- 步骤 ① -->
  <rect x="175" y="93" width="350" height="36" rx="8" fill="url(#stepGrad)" stroke="#26A69A" stroke-width="1.5" filter="url(#sh)"/>
  <text x="350" y="116" text-anchor="middle" font-size="13" fill="#00695C">① initFileTransport() — 初始化文件日志</text>

  <line x1="350" y1="129" x2="350" y2="145" stroke="#BDBDBD" stroke-width="1.5"/>
  <polygon points="344,143 356,143 350,153" fill="#BDBDBD"/>

  <!-- 步骤 ② -->
  <rect x="175" y="153" width="350" height="36" rx="8" fill="url(#stepGrad)" stroke="#26A69A" stroke-width="1.5" filter="url(#sh)"/>
  <text x="350" y="176" text-anchor="middle" font-size="13" fill="#00695C">② DbManager.init(dbPath) — 数据库建表+迁移+预置数据</text>

  <line x1="350" y1="189" x2="350" y2="205" stroke="#BDBDBD" stroke-width="1.5"/>
  <polygon points="344,203 356,203 350,213" fill="#BDBDBD"/>

  <!-- 步骤 ③-⑥ (注册 IPC) -->
  <rect x="175" y="213" width="350" height="100" rx="8" fill="#E8EAF6" stroke="#5C6BC0" stroke-width="1.5" filter="url(#sh)"/>
  <text x="350" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#283593">注册 IPC 控制器</text>
  <text x="350" y="257" text-anchor="middle" font-size="12" fill="#555">③ registerUserController() — 8 channels</text>
  <text x="350" y="275" text-anchor="middle" font-size="12" fill="#555">④ registerCategoryController() — 4 channels</text>
  <text x="350" y="293" text-anchor="middle" font-size="12" fill="#555">⑤ registerLedgerController() — 4 channels</text>
  <text x="350" y="311" text-anchor="middle" font-size="12" fill="#555">⑥ registerTransactionController() — 8 channels</text>

  <line x1="350" y1="313" x2="350" y2="330" stroke="#BDBDBD" stroke-width="1.5"/>
  <polygon points="344,328 356,328 350,338" fill="#BDBDBD"/>

  <!-- 步骤 ⑦ -->
  <rect x="175" y="338" width="350" height="36" rx="8" fill="url(#stepGrad)" stroke="#26A69A" stroke-width="1.5" filter="url(#sh)"/>
  <text x="350" y="361" text-anchor="middle" font-size="13" fill="#00695C">⑦ createSplashWindow() — 显示启动动画</text>

  <line x1="350" y1="374" x2="350" y2="390" stroke="#BDBDBD" stroke-width="1.5"/>
  <polygon points="344,388 356,388 350,398" fill="#BDBDBD"/>

  <!-- 步骤 ⑧ -->
  <rect x="175" y="398" width="350" height="36" rx="8" fill="url(#stepGrad)" stroke="#26A69A" stroke-width="1.5" filter="url(#sh)"/>
  <text x="350" y="421" text-anchor="middle" font-size="13" fill="#00695C">⑧ createWindow() — 创建主窗口（后台加载）</text>

  <line x1="350" y1="434" x2="350" y2="455" stroke="#FF9800" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="395" y="450" font-size="10" fill="#E65100">等待 ready-to-show</text>

  <!-- 最终节点 -->
  <rect x="125" y="460" width="450" height="100" rx="10" fill="url(#endGrad)" stroke="#FF7043" stroke-width="2" filter="url(#sh)"/>
  <text x="350" y="486" text-anchor="middle" font-size="14" font-weight="bold" fill="#D84315">mainWindow 'ready-to-show'</text>
  <line x1="200" y1="498" x2="500" y2="498" stroke="#FFCCBC" stroke-width="1"/>
  <text x="350" y="518" text-anchor="middle" font-size="12" fill="#555">1. 至少展现 1.5 秒</text>
  <text x="350" y="536" text-anchor="middle" font-size="12" fill="#555">2. 关闭 splash 窗口</text>
  <text x="350" y="554" text-anchor="middle" font-size="12" fill="#555">3. mainWindow.show()</text>
</svg>