<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 290" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <filter id="sh">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- ledger 表 -->
  <rect x="30" y="40" width="200" height="160" rx="8" fill="#E3F2FD" stroke="#1976D2" stroke-width="2" filter="url(#sh)"/>
  <rect x="30" y="40" width="200" height="36" rx="8" fill="#1976D2"/>
  <rect x="30" y="60" width="200" height="16" fill="#1976D2"/>
  <text x="130" y="64" text-anchor="middle" font-size="15" font-weight="bold" fill="white">ledger</text>
  <text x="130" y="76" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.8)">账本表</text>
  <text x="48" y="96" font-size="12" fill="#333">🔑 id</text>
  <text x="48" y="116" font-size="12" fill="#555">name</text>
  <text x="48" y="136" font-size="12" fill="#555">description</text>
  <text x="48" y="156" font-size="12" fill="#555">create_time</text>
  <line x1="30" y1="168" x2="230" y2="168" stroke="#BBDEFB" stroke-width="1"/>
  <text x="130" y="188" text-anchor="middle" font-size="10" fill="#888">初始数据：id=1 默认账本（不可删除）</text>

  <!-- transactions 表 -->
  <rect x="290" y="20" width="220" height="250" rx="8" fill="#FFF3E0" stroke="#E65100" stroke-width="2" filter="url(#sh)"/>
  <rect x="290" y="20" width="220" height="36" rx="8" fill="#E65100"/>
  <rect x="290" y="40" width="220" height="16" fill="#E65100"/>
  <text x="400" y="44" text-anchor="middle" font-size="15" font-weight="bold" fill="white">transactions</text>
  <text x="400" y="56" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.8)">交易记录表</text>
  <text x="308" y="76" font-size="11" fill="#333">🔑 id</text>
  <text x="308" y="94" font-size="11" fill="#555">type (income/expense)</text>
  <text x="308" y="112" font-size="11" fill="#555">amount</text>
  <text x="308" y="130" font-size="11" fill="#E65100" font-weight="bold">🔗 category_id → category(id)</text>
  <text x="308" y="148" font-size="11" fill="#1976D2" font-weight="bold">🔗 ledger_id → ledger(id)</text>
  <text x="308" y="166" font-size="11" fill="#555">trans_date</text>
  <text x="308" y="184" font-size="11" fill="#555">description</text>
  <text x="308" y="202" font-size="11" fill="#555">payment_method</text>
  <text x="308" y="220" font-size="11" fill="#555">create_time</text>
  <text x="308" y="238" font-size="11" fill="#555">update_time</text>
  <line x1="290" y1="248" x2="510" y2="248" stroke="#FFE0B2" stroke-width="1"/>
  <text x="400" y="265" text-anchor="middle" font-size="10" fill="#888">外键：category_id, ledger_id</text>

  <!-- category 表 -->
  <rect x="550" y="40" width="200" height="160" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2" filter="url(#sh)"/>
  <rect x="550" y="40" width="200" height="36" rx="8" fill="#2E7D32"/>
  <rect x="550" y="60" width="200" height="16" fill="#2E7D32"/>
  <text x="650" y="64" text-anchor="middle" font-size="15" font-weight="bold" fill="white">category</text>
  <text x="650" y="76" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.8)">分类表</text>
  <text x="568" y="96" font-size="12" fill="#333">🔑 id</text>
  <text x="568" y="116" font-size="12" fill="#555">name</text>
  <text x="568" y="136" font-size="12" fill="#555">type (income/expense)</text>
  <text x="568" y="156" font-size="12" fill="#555">icon</text>
  <text x="568" y="176" font-size="12" fill="#555">sort_order</text>
  <line x1="550" y1="188" x2="750" y2="188" stroke="#C8E6C9" stroke-width="1"/>
  <text x="650" y="208" text-anchor="middle" font-size="10" fill="#888">预置 16 条数据（10 支出 + 6 收入）</text>

  <!-- 关系线: ledger → transactions (1:N) -->
  <line x1="230" y1="120" x2="290" y2="148" stroke="#1976D2" stroke-width="2.5"/>
  <text x="260" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#1976D2">1────N</text>

  <!-- 关系线: transactions → category (N:1) -->
  <line x1="510" y1="130" x2="550" y2="130" stroke="#2E7D32" stroke-width="2.5"/>
  <text x="530" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#2E7D32">N────1</text>
</svg>