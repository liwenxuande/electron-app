<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <linearGradient id="navGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#42A5F5;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#42A5F5;stop-opacity:0.22"/>
    </linearGradient>
    <linearGradient id="dashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#66BB6A;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#66BB6A;stop-opacity:0.22"/>
    </linearGradient>
    <linearGradient id="actGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFA726;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#FFA726;stop-opacity:0.22"/>
    </linearGradient>
    <linearGradient id="statGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#AB47BC;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#AB47BC;stop-opacity:0.22"/>
    </linearGradient>
    <filter id="sh">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- 顶部导航栏 -->
  <rect x="30" y="20" width="840" height="50" rx="10" fill="url(#navGrad)" stroke="#42A5F5" stroke-width="2" filter="url(#sh)"/>
  <text x="450" y="51" text-anchor="middle" font-size="15" font-weight="bold" fill="#1565C0">顶部导航栏</text>

  <!-- Dashboard -->
  <rect x="80" y="100" width="200" height="60" rx="10" fill="url(#dashGrad)" stroke="#66BB6A" stroke-width="1.5" filter="url(#sh)"/>
  <text x="180" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#2E7D32">Dashboard</text>
  <text x="180" y="148" text-anchor="middle" font-size="11" fill="#666">首页</text>

  <!-- 记账管理 -->
  <rect x="350" y="100" width="200" height="60" rx="10" fill="url(#actGrad)" stroke="#FFA726" stroke-width="1.5" filter="url(#sh)"/>
  <text x="450" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#E65100">记账管理</text>
  <text x="450" y="148" text-anchor="middle" font-size="11" fill="#666">交易记录 CRUD</text>

  <!-- 数据统计 -->
  <rect x="620" y="100" width="200" height="60" rx="10" fill="url(#statGrad)" stroke="#AB47BC" stroke-width="1.5" filter="url(#sh)"/>
  <text x="720" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#6A1B9A">数据统计</text>
  <text x="720" y="148" text-anchor="middle" font-size="11" fill="#666">图表分析</text>

  <!-- 箭头从导航栏 -->
  <line x1="180" y1="70" x2="180" y2="100" stroke="#66BB6A" stroke-width="1.5"/>
  <polygon points="174,98 186,98 180,108" fill="#66BB6A"/>
  <line x1="450" y1="70" x2="450" y2="100" stroke="#FFA726" stroke-width="1.5"/>
  <polygon points="444,98 456,98 450,108" fill="#FFA726"/>
  <line x1="720" y1="70" x2="720" y2="100" stroke="#AB47BC" stroke-width="1.5"/>
  <polygon points="714,98 726,98 720,108" fill="#AB47BC"/>

  <!-- Dashboard 内容 -->
  <rect x="80" y="190" width="200" height="50" rx="8" fill="white" stroke="#A5D6A7" stroke-width="1"/>
  <text x="180" y="220" text-anchor="middle" font-size="12" fill="#333">当月收支概览</text>
  <line x1="180" y1="160" x2="180" y2="190" stroke="#66BB6A" stroke-width="1.5"/>
  <polygon points="174,188 186,188 180,198" fill="#66BB6A"/>

  <!-- 记账管理 内容 -->
  <rect x="290" y="190" width="320" height="50" rx="8" fill="white" stroke="#FFE0B2" stroke-width="1"/>
  <text x="450" y="212" text-anchor="middle" font-size="12" fill="#333">筛选栏 + 交易列表</text>
  <text x="450" y="230" text-anchor="middle" font-size="10" fill="#888">支持多维组合筛选 · 分页浏览</text>
  <line x1="450" y1="160" x2="450" y2="190" stroke="#FFA726" stroke-width="1.5"/>
  <polygon points="444,188 456,188 450,198" fill="#FFA726"/>

  <!-- 数据统计 内容 -->
  <rect x="560" y="190" width="320" height="50" rx="8" fill="white" stroke="#E1BEE7" stroke-width="1"/>
  <text x="720" y="212" text-anchor="middle" font-size="12" fill="#333">日期范围选择器</text>
  <text x="720" y="230" text-anchor="middle" font-size="10" fill="#888">选择时间段查看统计数据</text>
  <line x1="720" y1="160" x2="720" y2="190" stroke="#AB47BC" stroke-width="1.5"/>
  <polygon points="714,188 726,188 720,198" fill="#AB47BC"/>

  <!-- 记账管理的操作按钮 -->
  <rect x="290" y="270" width="96" height="36" rx="8" fill="#E8F5E9" stroke="#66BB6A" stroke-width="1.5"/>
  <text x="338" y="293" text-anchor="middle" font-size="12" fill="#2E7D32">新增记录</text>
  <line x1="350" y1="240" x2="338" y2="270" stroke="#66BB6A" stroke-width="1.5"/>
  <polygon points="334,267 342,267 338,277" fill="#66BB6A"/>

  <rect x="402" y="270" width="96" height="36" rx="8" fill="#FFF3E0" stroke="#FFA726" stroke-width="1.5"/>
  <text x="450" y="293" text-anchor="middle" font-size="12" fill="#E65100">导入 CSV</text>
  <line x1="450" y1="240" x2="450" y2="270" stroke="#FFA726" stroke-width="1.5"/>
  <polygon points="446,267 454,267 450,277" fill="#FFA726"/>

  <rect x="514" y="270" width="96" height="36" rx="8" fill="#FFEBEE" stroke="#EF5350" stroke-width="1.5"/>
  <text x="562" y="293" text-anchor="middle" font-size="12" fill="#C62828">删除记录</text>
  <line x1="510" y1="240" x2="562" y2="270" stroke="#EF5350" stroke-width="1.5"/>
  <polygon points="558,267 566,267 562,277" fill="#EF5350"/>

  <!-- 新增记录详情 -->
  <rect x="270" y="330" width="140" height="40" rx="6" fill="white" stroke="#C8E6C9" stroke-width="1"/>
  <text x="340" y="352" text-anchor="middle" font-size="10" fill="#555">TransactionDialog 弹窗</text>
  <text x="340" y="364" text-anchor="middle" font-size="9" fill="#888">填写 → Service校验 → 写入</text>
  <line x1="338" y1="306" x2="340" y2="330" stroke="#C8E6C9" stroke-width="1"/>

  <!-- 导入CSV详情 -->
  <rect x="420" y="330" width="180" height="40" rx="6" fill="white" stroke="#FFE0B2" stroke-width="1"/>
  <text x="510" y="352" text-anchor="middle" font-size="10" fill="#555">FileReader → IPC csvText</text>
  <text x="510" y="364" text-anchor="middle" font-size="10" fill="#555">→ 解析 → 事务写入</text>
  <line x1="450" y1="306" x2="510" y2="330" stroke="#FFE0B2" stroke-width="1"/>

  <!-- 数据统计详情 -->
  <rect x="560" y="270" width="320" height="60" rx="8" fill="white" stroke="#E1BEE7" stroke-width="1"/>
  <line x1="720" y1="240" x2="720" y2="270" stroke="#E1BEE7" stroke-width="1"/>
  <polygon points="714,268 726,268 720,278" fill="#E1BEE7"/>
  <text x="620" y="295" text-anchor="middle" font-size="11" fill="#6A1B9A">折线图</text>
  <text x="620" y="315" text-anchor="middle" font-size="9" fill="#888">每日趋势</text>
  <line x1="665" y1="280" x2="665" y2="320" stroke="#E1BEE7" stroke-width="0.5"/>
  <text x="720" y="295" text-anchor="middle" font-size="11" fill="#E65100">饼图1</text>
  <text x="720" y="315" text-anchor="middle" font-size="9" fill="#888">支出占比</text>
  <line x1="775" y1="280" x2="775" y2="320" stroke="#E1BEE7" stroke-width="0.5"/>
  <text x="830" y="295" text-anchor="middle" font-size="11" fill="#2E7D32">饼图2</text>
  <text x="830" y="315" text-anchor="middle" font-size="9" fill="#888">收入占比</text>

  <!-- 底部：账本切换 -->
  <rect x="350" y="395" width="200" height="45" rx="10" fill="#E8EAF6" stroke="#5C6BC0" stroke-width="1.5" filter="url(#sh)"/>
  <text x="450" y="422" text-anchor="middle" font-size="14" font-weight="bold" fill="#283593">账本切换 BookSwitcher</text>
</svg>